
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Quotation Manager</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Quotation Manager</h2>
  <p>Item Entry & Billing System</p>
</header>

<main>
  <section class="toolbar">
    <button onclick="addRow()">+ Add Item</button>
    <button onclick="document.getElementById('importFile').click()">Import CSV</button>
    <input type="file" id="importFile" accept=".csv,text/csv" hidden
      onchange="importCSV(event)">
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="window.print()">Print / PDF</button>
    <button class="danger" onclick="clearAll()">Clear All</button>
  </section>

  <div class="table-wrap">
    <table id="itemTable">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Item</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Discount %</th>
          <th>Discount</th>
          <th>Net Price</th>
          <th>Total</th>
          <th class="no-print">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <section class="summary">
    <div>
      <span>Subtotal</span>
      <strong id="subtotal">₹0.00</strong>
    </div>
    <div>
      <span>Total Discount</span>
      <strong id="discountTotal">₹0.00</strong>
    </div>
    <div class="grand">
      <span>Grand Total</span>
      <strong id="grandTotal">₹0.00</strong>
    </div>
  </section>
</main>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
